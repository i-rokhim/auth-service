<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ganti password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Ganti password</h1>
    <p id="notice" role="status"></p>

    <form id="change-form">
      <label for="old-password">Password lama</label>
      <input id="old-password" name="old_password" type="password"
             autocomplete="current-password" required>
      <p class="field-error" id="old-password-error" role="alert"></p>

      <label for="new-password">Password baru</label>
      <input id="new-password" name="new_password" type="password"
             autocomplete="new-password" required>
      <p class="field-error" id="new-password-error" role="alert"></p>

      <label for="repeat-password">Ulangi password baru</label>
      <input id="repeat-password" name="repeat_password" type="password"
             autocomplete="new-password" required>
      <p class="field-error" id="repeat-password-error" role="alert"></p>

      <p id="form-error" role="alert"></p>
      <button type="submit">Ganti password</button>
    </form>

    <p><a href="profile.html">Kembali ke profil</a></p>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    // Halaman ini butuh login.
    Auth.requireLogin();

    const form = document.getElementById('change-form');
    const notice = document.getElementById('notice');
    const formError = document.getElementById('form-error');
    const repeatError = document.getElementById('repeat-password-error');
    const button = form.querySelector('button');
    const fieldErrors = {
      old_password: document.getElementById('old-password-error'),
      new_password: document.getElementById('new-password-error'),
    };

    function clearMessages() {
      notice.textContent = '';
      formError.textContent = '';
      repeatError.textContent = '';
      Object.values(fieldErrors).forEach((element) => {
        element.textContent = '';
      });
    }

    // Pesan dari server ditampilkan apa adanya: yang menyangkut satu kolom
    // di bawah kolomnya, selebihnya di atas tombol.
    function showErrors(data) {
      let shown = false;
      Object.entries(fieldErrors).forEach(([name, element]) => {
        if (data && Array.isArray(data[name])) {
          element.textContent = data[name].join(' ');
          shown = true;
        }
      });
      if (!shown) {
        formError.textContent = Api.firstMessage(data);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessages();

      // Pengecekan "ulangi password" hanya di frontend, tidak dikirim ke server.
      const newPassword = form.elements.new_password.value;
      if (newPassword !== form.elements.repeat_password.value) {
        repeatError.textContent = 'Password baru dan ulangannya tidak sama.';
        return;
      }

      button.disabled = true;
      const result = await Api.request('/auth/password/change/', {
        method: 'POST',
        body: {
          old_password: form.elements.old_password.value,
          new_password: newPassword,
        },
      });

      if (result.ok) {
        form.reset();
        notice.textContent = 'Password berhasil diganti.';
      } else {
        showErrors(result.data);
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
