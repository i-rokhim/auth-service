<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atur password baru</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Atur password baru</h1>
    <p id="notice" role="status"></p>
    <p class="field-error" id="link-error" role="alert"></p>

    <form id="reset-form">
      <label for="new-password">Password baru</label>
      <input id="new-password" name="new_password" type="password"
             autocomplete="new-password" required>
      <p class="field-error" id="new-password-error" role="alert"></p>

      <label for="repeat-password">Ulangi password baru</label>
      <input id="repeat-password" name="repeat_password" type="password"
             autocomplete="new-password" required>
      <p class="field-error" id="repeat-password-error" role="alert"></p>

      <button type="submit">Atur password</button>
    </form>

    <p><a href="forgot-password.html">Minta tautan baru</a></p>
    <p><a href="index.html">Ke halaman Masuk</a></p>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    // uid dan token berasal dari tautan di email.
    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');
    const token = params.get('token');

    const form = document.getElementById('reset-form');
    const notice = document.getElementById('notice');
    const linkError = document.getElementById('link-error');
    const newError = document.getElementById('new-password-error');
    const repeatError = document.getElementById('repeat-password-error');
    const button = form.querySelector('button');

    function clearMessages() {
      notice.textContent = '';
      linkError.textContent = '';
      newError.textContent = '';
      repeatError.textContent = '';
    }

    if (!uid || !token) {
      form.hidden = true;
      linkError.textContent = 'Tautan tidak lengkap. Minta tautan baru di bawah.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearMessages();

      // Pengecekan "ulangi password" hanya di frontend, tidak dikirim ke server.
      const newPassword = form.elements.new_password.value;
      if (newPassword !== form.elements.repeat_password.value) {
        repeatError.textContent = 'Password baru dan ulangannya tidak sama.';
        return;
      }

      button.disabled = true;
      const result = await Api.request('/auth/password/reset/confirm/', {
        method: 'POST',
        body: { uid, token, new_password: newPassword },
        auth: false,
      });

      if (result.ok) {
        // Semua sesi lama sudah dicabut di server. Sisa sesi di browser ini
        // dihapus juga, supaya halaman Masuk tidak mengira pengguna masih masuk.
        Auth.clear();
        form.hidden = true;
        notice.textContent = 'Password berhasil diatur ulang. Silakan masuk dengan password baru.';
        return;
      }

      // Pesan dari server ditampilkan apa adanya.
      if (result.data && Array.isArray(result.data.new_password)) {
        newError.textContent = result.data.new_password.join(' ');
      } else {
        linkError.textContent = Api.firstMessage(result.data);
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
