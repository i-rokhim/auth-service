<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Lupa password</h1>
    <p id="notice" role="status"></p>
    <p class="hint">Masukkan email akun Anda. Jika terdaftar, kami kirim tautan untuk mengatur ulang password.</p>

    <form id="forgot-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username"
             placeholder="nama@contoh.com" required>

      <p id="form-error" role="alert"></p>
      <button type="submit">Kirim tautan</button>
    </form>

    <p><a href="index.html">Kembali ke Masuk</a></p>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById('forgot-form');
    const notice = document.getElementById('notice');
    const formError = document.getElementById('form-error');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      notice.textContent = '';
      formError.textContent = '';
      button.disabled = true;

      const result = await Api.request('/auth/password/reset/request/', {
        method: 'POST',
        body: { email: form.elements.email.value },
        auth: false,
      });

      if (result.ok) {
        form.reset();
        // Pesan yang sama untuk email terdaftar maupun tidak, seperti respons server.
        notice.textContent = 'Jika email terdaftar, tautan untuk mengatur ulang password sudah dikirim. Silakan periksa kotak masuk Anda.';
      } else {
        formError.textContent = Api.firstMessage(result.data);
      }
      button.disabled = false;
    });
  </script>
</body>
</html>
