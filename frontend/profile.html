<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil saya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Profil saya</h1>
    <p id="notice" role="status"></p>

    <dl>
      <dt>Email</dt>
      <dd id="user-email"></dd>
      <dt>Role</dt>
      <dd id="user-role"></dd>
      <dt>Nama</dt>
      <dd id="user-name"></dd>
    </dl>

    <form id="name-form">
      <label for="name">Ubah nama</label>
      <input id="name" name="name" type="text" maxlength="150"
             autocomplete="name" required>

      <p id="form-error" role="alert"></p>
      <button type="submit">Simpan nama</button>
    </form>

    <p><a href="change-password.html">Ganti password</a></p>

    <p><button type="button" id="logout-button">Keluar</button></p>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    const nameForm = document.getElementById('name-form');
    const nameInput = document.getElementById('name');
    const formError = document.getElementById('form-error');
    const notice = document.getElementById('notice');
    const saveButton = nameForm.querySelector('button');

    // Semua data pengguna dipasang lewat textContent dan value, bukan innerHTML.
    function showProfile(user) {
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('user-role').textContent = user.role;
      document.getElementById('user-name').textContent = user.name;
      nameInput.value = user.name;
    }

    async function loadProfile() {
      const result = await Api.request('/auth/profile/');
      if (result.ok) {
        Auth.setUser(result.data);
        showProfile(result.data);
      } else {
        formError.textContent = Api.firstMessage(result.data);
      }
    }

    if (Auth.requireLogin()) {
      // Data dari login tampil lebih dulu, lalu diganti data terbaru dari server.
      const saved = Auth.getUser();
      if (saved) {
        showProfile(saved);
      }
      loadProfile();
    }

    nameForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.textContent = '';
      notice.textContent = '';
      saveButton.disabled = true;

      const result = await Api.request('/auth/profile/', {
        method: 'PATCH',
        body: { name: nameInput.value },
      });

      if (result.ok) {
        Auth.setUser(result.data);
        showProfile(result.data);
        notice.textContent = 'Nama berhasil diperbarui.';
      } else {
        formError.textContent = Api.firstMessage(result.data);
      }
      saveButton.disabled = false;
    });

    document.getElementById('logout-button').addEventListener('click', async (event) => {
      event.target.disabled = true;
      // Cabut refresh token di server, lalu hapus sesi di browser. Sesi di
      // browser tetap dihapus walau permintaan gagal, supaya pengguna benar-benar
      // keluar dari sisi frontend.
      await Api.request('/auth/logout/', {
        method: 'POST',
        body: { refresh: Auth.getRefresh() },
      });
      Auth.clear();
      Auth.redirectToLogin();
    });
  </script>
</body>
</html>
